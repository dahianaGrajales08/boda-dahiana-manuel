<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dahiana & Manuel - Nos Casamos</title>
    <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500&family=Great+Vibes&display=swap)" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --olive: #6B7B3C;
            --olive-light: #8A9A5B;
            --olive-dark: #4A5528;
            --gold: #C9A227;
            --gold-light: #E8D5A3;
            --white: #FFFEF9;
            --cream: #FAF8F0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--white) 50%, var(--gold-light) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .invitation {
            background: linear-gradient(180deg, var(--white) 0%, var(--cream) 100%);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 
                0 25px 80px rgba(107, 123, 60, 0.15),
                0 0 0 1px rgba(201, 162, 39, 0.2),
                inset 0 0 100px rgba(255, 255, 255, 0.9);
            position: relative;
            overflow: hidden;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Decoraciones de lirios */
        .lily {
            position: absolute;
            font-size: 40px;
            opacity: 0.6;
            animation: sway 4s ease-in-out infinite;
        }

        .lily-1 { top: 20px; left: 20px; animation-delay: 0s; }
        .lily-2 { top: 20px; right: 20px; animation-delay: 0.5s; transform: scaleX(-1); }
        .lily-3 { bottom: 20px; left: 20px; animation-delay: 1s; }
        .lily-4 { bottom: 20px; right: 20px; animation-delay: 1.5s; transform: scaleX(-1); }

        @keyframes sway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .lily-2, .lily-4 {
            animation: sway-reverse 4s ease-in-out infinite;
        }

        @keyframes sway-reverse {
            0%, 100% { transform: scaleX(-1) rotate(-5deg); }
            50% { transform: scaleX(-1) rotate(5deg); }
        }

        /* Partículas doradas */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: sparkle 3s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0) translateY(0); }
            50% { opacity: 0.8; transform: scale(1) translateY(-20px); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .pre-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            letter-spacing: 6px;
            color: var(--olive);
            text-transform: uppercase;
            margin-bottom: 15px;
            animation: fadeInDown 1s ease-out;
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 52px;
            color: var(--olive-dark);
            line-height: 1.2;
            animation: fadeInUp 1s ease-out 0.3s backwards;
            text-shadow: 2px 2px 4px rgba(107, 123, 60, 0.1);
        }

        .ampersand {
            display: block;
            font-size: 36px;
            color: var(--gold);
            margin: 5px 0;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 25px 0;
            animation: fadeIn 1s ease-out 0.6s backwards;
        }

        .divider-line {
            height: 1px;
            width: 80px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .divider-icon {
            margin: 0 15px;
            color: var(--gold);
            font-size: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .announcement {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out 0.8s backwards;
        }

        .we-marry {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--olive);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .date-section {
            text-align: center;
            background: linear-gradient(135deg, var(--olive) 0%, var(--olive-dark) 100%);
            border-radius: 20px;
            padding: 30px;
            margin: 25px 0;
            position: relative;
            animation: scaleIn 0.8s ease-out 1s backwards;
            overflow: hidden;
        }

        .date-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shine 3s ease-in-out infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .date {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-weight: 700;
            color: var(--white);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }

        .date-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: var(--gold-light);
            letter-spacing: 3px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .venue {
            text-align: center;
            margin: 25px 0;
            animation: fadeIn 1s ease-out 1.2s backwards;
        }

        .venue-name {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--olive-dark);
            margin-bottom: 8px;
        }

        .venue-location {
            font-size: 14px;
            color: var(--olive);
            letter-spacing: 2px;
        }

        .map-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            padding: 12px 25px;
            background: linear-gradient(135deg, var(--gold) 0%, #D4AF37 100%);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(201, 162, 39, 0.3);
        }

        .map-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(201, 162, 39, 0.4);
        }

        .confirm-section {
            background: linear-gradient(135deg, var(--cream) 0%, var(--white) 100%);
            border: 2px solid var(--gold-light);
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
            text-align: center;
            animation: fadeIn 1s ease-out 1.4s backwards;
        }

        .confirm-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--olive-dark);
            margin-bottom: 20px;
        }

        .whatsapp-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
        }

        .whatsapp-btn svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 25px 0;
            animation: fadeIn 1s ease-out 1.6s backwards;
        }

        .countdown-item {
            background: var(--white);
            border: 1px solid var(--gold-light);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
        }

        .countdown-number {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--olive-dark);
            display: block;
        }

        .countdown-label {
            font-size: 10px;
            color: var(--olive);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            animation: fadeIn 1s ease-out 1.8s backwards;
        }

        .hashtag {
            font-family: 'Great Vibes', cursive;
            font-size: 28px;
            color: var(--gold);
        }

        .olive-branch {
            margin-top: 15px;
            font-size: 30px;
            animation: sway 3s ease-in-out infinite;
        }

        /* Animación de entrada de corazones */
        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            animation: floatUp 4s ease-in infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(100%) scale(0);
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(1);
            }
        }

        /* Responsive */
        @media (max-width: 500px) {
            .invitation {
                padding: 40px 25px;
            }
            .names {
                font-size: 42px;
            }
            .date {
                font-size: 36px;
            }
            .countdown-number {
                font-size: 22px;
            }
        }
    </style>
</head>

    <script>
        // Cuenta regresiva
        function updateCountdown() {
            const weddingDate = new Date('October 3, 2026 12:00:00').getTime();
            const now = new Date().getTime();
            const distance = weddingDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days.toString().padStart(3, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Crear partículas doradas
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 3 + 's';
                particle.style.width = (Math.random() * 6 + 4) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        // Crear corazones flotantes
        function createHearts() {
            const container = document.getElementById('hearts');
            const hearts = ['💚', '🤍', '💛'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                container.appendChild(heart);
                
                setTimeout(() => heart.remove(), 5000);
            }, 800);
        }

        createParticles();
        createHearts();
    </script>
